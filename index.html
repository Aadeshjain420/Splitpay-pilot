<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Splitpay</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');body{font-family:'Inter',sans-serif}.custom-checkbox{appearance:none;width:20px;height:20px;border:2px solid #9ca3af;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:#fff}.custom-checkbox:checked::after{content:'✔';color:#16a34a;font-size:14px;font-weight:bold}</style></head><body class="bg-white text-black min-h-screen flex flex-col"><header class="w-full border-b border-gray-300 p-4 flex justify-between items-center sticky top-0 bg-white z-20"><div onclick="showTab('generateTab')" class="flex items-center gap-3 cursor-pointer"><div class="w-10 h-10 bg-gray-100 border rounded-xl flex items-center justify-center font-extrabold">₹</div><h1 id="navShopName" class="font-extrabold">Splitpay</h1></div><button onclick="toggleMenu()" class="p-2 border rounded-lg">☰</button><div id="dropdownMenu" class="hidden absolute right-4 top-16 w-48 bg-white border rounded-xl shadow-lg py-2 z-30"><button onclick="showTab('generateTab');toggleMenu()" class="w-full px-4 py-2.5 text-sm font-bold text-left">Home</button><button onclick="showTab('shopProfileTab');toggleMenu()" class="w-full px-4 py-2.5 text-sm font-bold text-left border-t">Shop Profile</button><button onclick="showTab('historyTab');toggleMenu()" class="w-full px-4 py-2.5 text-sm font-bold text-left border-t">History</button><button onclick="showTab('settingsTab');toggleMenu()" class="w-full px-4 py-2.5 text-sm font-bold text-left border-t">Settings</button></div></header><main class="flex-1 p-4 max-w-5xl mx-auto w-full pb-20"><section id="generateTab" class="space-y-6"><div class="border rounded-xl p-6 space-y-5 shadow-sm"><h2 class="text-lg font-extrabold border-b pb-4">New Payment</h2><div class="bg-gray-50 border rounded-xl p-4 space-y-3"><div class="grid grid-cols-12 gap-3"><input id="calcAmountInput" type="number" placeholder="Enter Amount" class="col-span-10 border px-3 py-2 rounded-lg font-bold"><button onclick="addSimpleAmount()" class="col-span-2 bg-gray-700 text-white rounded-lg text-xs font-bold">Add</button></div><div id="addedAmountsContainer" class="hidden border rounded-lg bg-white max-h-40 overflow-y-auto"></div></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-5"><div><label class="text-xs font-bold uppercase">Total Amount</label><div class="relative flex items-center"><span class="absolute left-3 font-extrabold">₹</span><input id="inputAmount" type="number" oninput="calculateRemaining()" placeholder="0.00" class="w-full pl-9 pr-20 py-2.5 border rounded-lg font-bold"><button onclick="clearTotalAmount()" class="absolute right-2 px-3 py-1 bg-red-600 text-white text-xs rounded-lg">Clear</button></div></div><div><label class="text-xs font-bold uppercase">Cash Paid</label><div class="relative flex items-center"><span class="absolute left-3 font-extrabold">₹</span><input id="inputCashPaid" type="number" oninput="calculateRemaining()" placeholder="0.00" class="w-full pl-9 pr-20 py-2.5 border rounded-lg font-bold"><button onclick="clearCashPaid()" class="absolute right-2 px-3 py-1 bg-red-600 text-white text-xs rounded-lg">Clear</button></div></div></div><div class="p-4 bg-gray-100 border rounded-xl flex justify-between"><span class="text-xs font-bold">Remaining:</span><div id="displayRemainingAmount" class="text-xl font-extrabold">₹0.00</div></div><button onclick="generateQRs()" class="w-full py-3.5 bg-gray-700 text-white font-bold rounded-xl">Generate QR Codes</button></div></section><section id="shopProfileTab" class="hidden"><div class="border rounded-xl p-6"><h2 class="font-extrabold mb-4">Shop Profile</h2><input id="settingShopName" class="w-full border px-3 py-2 rounded-lg font-bold"><button onclick="saveShopName()" class="mt-3 px-4 py-2 bg-gray-700 text-white rounded-lg">Save</button><button onclick="showTab('generateTab')" class="mt-6 px-4 py-2 bg-gray-200 rounded-lg">Back</button></div></section><section id="historyTab" class="hidden"><div class="border rounded-xl p-6"><h2 class="font-extrabold mb-4">Transaction History</h2><div id="historyItems"></div><button onclick="showTab('generateTab')" class="mt-6 px-4 py-2 bg-gray-200 rounded-lg">Back</button></div></section><section id="settingsTab" class="hidden"><div class="border rounded-xl p-6 space-y-4"><h2 class="font-extrabold">Manage UPI Accounts</h2><ul id="upiList" class="border rounded-lg divide-y"></ul><button onclick="toggleUpiModal(true)" class="w-full py-3.5 bg-gray-700 text-white font-bold rounded-xl">Add New Account</button><button onclick="showTab('generateTab')" class="px-4 py-2 bg-gray-200 rounded-lg">Back</button></div></section></main><div id="qrModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl border max-w-md w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto"><div id="qrModalCardContent"></div><div class="flex justify-between border-t pt-3"><button onclick="prevQrSlide()" class="px-3 py-2 bg-gray-200 rounded-lg text-xs font-bold">← Prev</button><span id="qrDotIndicator" class="text-xs font-bold">1 / 1</span><button onclick="nextQrSlide()" class="px-3 py-2 bg-gray-200 rounded-lg text-xs font-bold">Next →</button></div><button onclick="completePaymentFromModal()" class="w-full py-3.5 bg-gray-700 text-white font-bold rounded-xl">Complete & Save</button><button onclick="closeQrModal()" class="w-full py-2 bg-gray-100 rounded-lg text-xs">Close</button></div></div><div id="addUpiModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-xl border max-w-md w-full p-6 space-y-3"><h3 class="font-extrabold">Add UPI Account</h3><input id="newUpiName" placeholder="Nickname" class="w-full border px-3 py-2 rounded-lg font-bold"><input id="newUpiId" placeholder="UPI ID" class="w-full border px-3 py-2 rounded-lg font-bold"><input id="newBankName" placeholder="Bank (Optional)" class="w-full border px-3 py-2 rounded-lg font-bold"><div class="flex gap-3"><button onclick="toggleUpiModal(false)" class="flex-1 py-2.5 bg-gray-200 rounded-lg">Cancel</button><button onclick="saveUpiAccount()" class="flex-1 py-2.5 bg-gray-700 text-white rounded-lg">Save</button></div></div></div><div id="hiddenQrContainer" style="display:none"></div><script>
let state={shopName:localStorage.getItem('shopName')||'Splitpay',upiAccounts:JSON.parse(localStorage.getItem('upiAccounts'))||[],history:JSON.parse(localStorage.getItem('history'))||[],addedAmounts:[]};let splitItems=[],currentQrSlideIndex=0,touchStartX=0;
function maskUpi(u){if(!u)return'';let p=u.split('@');return p.length==2?p[0].slice(0,2)+'***'+p[0].slice(-1)+'@'+p[1]:u.slice(0,2)+'***'+u.slice(-2)}
function getQRCodeImageDataUrlUltraHD(t){return new Promise(r=>{const d=document.createElement('div');document.getElementById('hiddenQrContainer').innerHTML='';document.getElementById('hiddenQrContainer').appendChild(d);new QRCode(d,{text:t,width:1000,height:1000});setTimeout(()=>r(d.querySelector('canvas').toDataURL()),600)})}
function showTab(id){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function toggleMenu(){document.getElementById('dropdownMenu').classList.toggle('hidden')}
function addSimpleAmount(){let v=parseFloat(document.getElementById('calcAmountInput').value);if(!v)return;state.addedAmounts.push(v);document.getElementById('calcAmountInput').value='';renderAdded();calcTotal()}
function renderAdded(){let c=document.getElementById('addedAmountsContainer');if(!state.addedAmounts.length){c.classList.add('hidden');return}c.classList.remove('hidden');c.innerHTML=state.addedAmounts.map((a,i)=>`<div class="flex justify-between p-2 text-sm"><span>₹${a}</span><button onclick="removeAdded(${i})" class="text-red-600">x</button></div>`).join('')}
function removeAdded(i){state.addedAmounts.splice(i,1);renderAdded();calcTotal()}
function calcTotal(){let s=state.addedAmounts.reduce((a,b)=>a+b,0);document.getElementById('inputAmount').value=s;calculateRemaining()}
function clearTotalAmount(){document.getElementById('inputAmount').value='';state.addedAmounts=[];renderAdded();calculateRemaining()}
function clearCashPaid(){document.getElementById('inputCashPaid').value='';calculateRemaining()}
function calculateRemaining(){let t=parseFloat(document.getElementById('inputAmount').value)||0;let c=parseFloat(document.getElementById('inputCashPaid').value)||0;document.getElementById('displayRemainingAmount').innerText='₹'+(t-c).toFixed(2)}
function saveShopName(){let n=document.getElementById('settingShopName').value;localStorage.setItem('shopName',n);state.shopName=n;document.getElementById('navShopName').innerText=n;showTab('generateTab')}
function renderUpiList(){let ul=document.getElementById('upiList');if(!state.upiAccounts.length){ul.innerHTML='<li class="p-3 text-xs text-gray-500">No UPI</li>';return}ul.innerHTML=state.upiAccounts.map(a=>`<li class="p-3 flex justify-between"><span class="font-bold text-sm">${a.name} - ${maskUpi(a.upi)}</span><button onclick="deleteUpi('${a.id}')" class="text-red-600 text-xs">Delete</button></li>`).join('')}
function toggleUpiModal(s){document.getElementById('addUpiModal').classList.toggle('hidden',!s)}
function saveUpiAccount(){let name=document.getElementById('newUpiName').value,upi=document.getElementById('newUpiId').value;if(!name||!upi)return alert('Fill');state.upiAccounts.push({id:Date.now().toString(),name,upi,bank:document.getElementById('newBankName').value});localStorage.setItem('upiAccounts',JSON.stringify(state.upiAccounts));toggleUpiModal(false);renderUpiList()}
function deleteUpi(id){state.upiAccounts=state.upiAccounts.filter(a=>a.id!=id);localStorage.setItem('upiAccounts',JSON.stringify(state.upiAccounts));renderUpiList()}
function generateQRs(){let total=parseFloat(document.getElementById('inputAmount').value)||0;let cash=parseFloat(document.getElementById('inputCashPaid').value)||0;let rem=total-cash;if(rem<=0)return alert('No remaining');if(!state.upiAccounts.length)return alert('Add UPI in Settings');let per=parseFloat((rem/state.upiAccounts.length).toFixed(2));splitItems=state.upiAccounts.map((acc,i)=>({amount:per,accountName:acc.name,upiId:acc.upi,upiUrl:`upi://pay?pa=${acc.upi}&am=${per}&cu=INR&tn=Splitpay`,isPaidUpi:false,qrIndex:i+1}));document.getElementById('qrModal').classList.remove('hidden');document.getElementById('qrModal').classList.add('flex');renderQrSlide(0)}
function closeQrModal(){document.getElementById('qrModal').classList.add('hidden');document.getElementById('qrModal').classList.remove('flex')}
function nextQrSlide(){if(currentQrSlideIndex<splitItems.length-1){currentQrSlideIndex++;renderQrSlide(currentQrSlideIndex)}}
function prevQrSlide(){if(currentQrSlideIndex>0){currentQrSlideIndex--;renderQrSlide(currentQrSlideIndex)}}
function toggleModalQrStatus(i,c){splitItems[i].isPaidUpi=c}
async function downloadSingleQr(i){let f=await createUltraHdImageBlob(splitItems[i]);let a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
async function shareSingleQr(i){let f=await createUltraHdImageBlob(splitItems[i]);if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]});else downloadSingleQr(i)}
function completePaymentFromModal(){state.history.push({date:new Date().toLocaleString(),total:document.getElementById('inputAmount').value,items:splitItems});localStorage.setItem('history',JSON.stringify(state.history));closeQrModal();alert('Saved');renderHistoryList()}
function renderHistoryList(){let c=document.getElementById('historyItems');c.innerHTML=state.history.length?state.history.map(h=>`<div class="p-3 border-b text-sm">₹${h.total} - ${h.date}</div>`).join(''):'<div class="text-xs text-gray-500">No history</div>'}
function renderQrSlide(index){const s=splitItems[index];currentQrSlideIndex=index;const card=document.getElementById('qrModalCardContent');card.innerHTML=`<div class="bg-white rounded-xl border p-5 flex flex-col space-y-4"><div class="flex justify-between border-b pb-3"><div></div><div class="text-xl font-extrabold">₹${s.amount}</div><button onclick="closeQrModal()" class="text-2xl">&times;</button></div><div class="text-center text-xs font-bold bg-gray-100 py-1.5 rounded">${s.accountName}</div><div class="flex justify-center p-3 border rounded" id="modalQrCanvasContainer"></div><div class="text-xs font-mono font-bold text-center">${maskUpi(s.upiId)}</div><hr><div class="text-xs text-center text-gray-600">Scan and Pay with any UPI app</div><div class="flex justify-between pt-3 border-t"><label class="text-xs font-bold"><input type="checkbox" ${s.isPaidUpi?'checked':''} onchange="toggleModalQrStatus(${currentQrSlideIndex},this.checked)" class="custom-checkbox"> UPI Paid</label><div class="flex gap-2"><button onclick="downloadSingleQr(${currentQrSlideIndex})" class="p-2 bg-gray-700 text-white rounded">DL</button><button onclick="shareSingleQr(${currentQrSlideIndex})" class="p-2 bg-gray-700 text-white rounded">Share</button></div></div></div>`;document.getElementById('modalQrCanvasContainer').innerHTML='';new QRCode(document.getElementById('modalQrCanvasContainer'),{text:s.upiUrl,width:200,height:200});document.getElementById('qrDotIndicator').innerText=(index+1)+' / '+splitItems.length}
async function createUltraHdImageBlob(splitItem){const qrDataUrl=await getQRCodeImageDataUrlUltraHD(splitItem.upiUrl);return new Promise((resolve)=>{const canvas=document.createElement('canvas');canvas.width=3200;canvas.height=4300;const ctx=canvas.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#1e1e1e';ctx.lineWidth=16;ctx.beginPath();ctx.roundRect(160,160,2880,3980,120);ctx.stroke();ctx.fillStyle='#FFFFFF';ctx.fill();ctx.fillStyle='#000000';ctx.font='800 240px Inter, sans-serif';ctx.textAlign='center';ctx.fillText(`₹${splitItem.amount}`,1600,480);ctx.fillStyle='#F3F4F6';ctx.beginPath();ctx.roundRect(320,680,2560,240,40);ctx.fill();ctx.fillStyle='#000000';ctx.font='800 130px Inter, sans-serif';ctx.fillText(splitItem.accountName,1600,840);const img=new Image();img.onload=()=>{ctx.drawImage(img,640,1140,1920,1920);ctx.font='bold 110px monospace';ctx.fillText(maskUpi(splitItem.upiId),1600,3560);ctx.fillStyle='#4B5563';ctx.font='600 90px Inter';ctx.fillText("Scan and Pay with any UPI app",1600,3840);canvas.toBlob((blob)=>{resolve(new File([blob],`QR_${splitItem.qrIndex}_₹${splitItem.amount}.png`,{type:'image/png'}))},'image/png',1.0)};img.src=qrDataUrl})}
document.addEventListener("DOMContentLoaded",()=>{document.getElementById('navShopName').innerText=state.shopName;document.getElementById('settingShopName').value=state.shopName;renderUpiList();renderHistoryList();calculateRemaining()});
</script></body></html>
